services:
  wrapped365:
    image: ghcr.io/j25519/wrapped-365:latest
    container_name: wrapped365
    restart: unless-stopped
    ports:
      - "6967:6967"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    # No data volumes: browser-only processing and persistence.
