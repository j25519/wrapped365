# Wrapped 365: one .env file controls LAN or reverse-proxy networking.
# Standalone beta: docker compose up -d
# Full beta:       WRAPPED365_IMAGE_TAG=beta-full docker compose --profile mdb58 up -d
# Full + ClamAV:   WRAPPED365_IMAGE_TAG=beta-full docker compose --profile mdb58 --profile antivirus up -d
# Select a full frontend image when enabling the MDB58 profile.
# Set WRAPPED365_NETWORK_MODE=proxy and WRAPPED365_HOST_BIND=127.0.0.1
# on a VPS when an outer reverse proxy runs directly on the same host.
services:
  wrapped365:
    image: ghcr.io/j25519/wrapped365:${WRAPPED365_IMAGE_TAG:-beta-standalone}
    container_name: wrapped365
    restart: unless-stopped
    ports:
      - "${WRAPPED365_HOST_BIND:-127.0.0.1}:6967:6967"
    # Caddy's mode-specific configuration is baked into BOTH frontend editions.
    command:
      - run
      - --config
      - /etc/caddy/Caddyfile.${WRAPPED365_NETWORK_MODE:-lan}
      - --adapter
      - caddyfile
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      WRAPPED365_NETWORK_MODE: ${WRAPPED365_NETWORK_MODE:-lan}
      WRAPPED365_LAN_IP: ${WRAPPED365_LAN_IP:-127.0.0.1}
      WRAPPED365_LAN_HOST: ${WRAPPED365_LAN_HOST:-asus-box.local}
    volumes:
      - caddy_config:/config
      - caddy_data:/data
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m,mode=1777
    networks:
      - wrapped365-edge
    # The frontend must work on its own. No depends_on: mdb58-api here.

  mdb58-api:
    profiles:
      - mdb58
    image: ghcr.io/j25519/wrapped365-mdb58:${MDB58_IMAGE_TAG:-beta-full}
    container_name: wrapped365-mdb58-api
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m,mode=1777
    environment:
      # Use optional interpolation here: Compose evaluates it before
      # filtering inactive profiles. Missing values must fail during
      # full-stack startup, not prevent standalone Compose parsing.
      DATABASE_URL: postgresql://mdb58:${POSTGRES_PASSWORD:-}@mdb58-db:5432/mdb58
      MDB58_INVITE_PEPPER: ${MDB58_INVITE_PEPPER:-}
      # Derived from the same .env public origin used to deploy Wrapped 365.
      MDB58_ALLOWED_ORIGIN: ${WRAPPED365_PUBLIC_ORIGIN:-}
      MDB58_CLAMAV_REQUIRED: ${MDB58_CLAMAV_REQUIRED:-true}
      MDB58_CLAMAV_HOST: mdb58-clamav
      MDB58_ADMIN_SETUP_TOKEN: ${MDB58_ADMIN_SETUP_TOKEN:-}
    depends_on:
      mdb58-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/mdb58/api/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - wrapped365-edge
      - mdb58-private

  mdb58-db:
    profiles:
      - mdb58
    image: postgres:17-alpine
    container_name: wrapped365-mdb58-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mdb58
      POSTGRES_DB: mdb58
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - mdb58_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdb58 -d mdb58"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - mdb58-private

  # Optional ClamAV: enable alongside mdb58 with --profile antivirus.
  # Leave MDB58_CLAMAV_REQUIRED=true for fail-closed operation, or
  # set false explicitly if you do not want the scanner running.
  mdb58-clamav:
    profiles:
      - antivirus
    image: clamav/clamav:stable
    container_name: wrapped365-mdb58-clamav
    restart: unless-stopped
    volumes:
      - mdb58_clamav_signatures:/var/lib/clamav
    security_opt:
      - no-new-privileges:true
    networks:
      - mdb58-private
      - mdb58-updates

networks:
  wrapped365-edge: {}
  mdb58-private:
    internal: true
  # Outbound signature updates for ClamAV; database never joins this network.
  mdb58-updates: {}

volumes:
  caddy_config:
  caddy_data:
  mdb58_postgres:
  mdb58_clamav_signatures:
