name: Build and publish Docker image

on:
  push:
    branches: [main, test, test2]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Static checks and non-root smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Fingerprint static assets
        shell: bash
        run: |
          set -euo pipefail

          js_hash="$(sha256sum app.js | cut -c1-12)"
          css_hash="$(sha256sum styles.css | cut -c1-12)"

          sed -i -E \
            -e "s@(src=\"\./app\.js)(\?v=[^\"]*)?(\")@\1?v=${js_hash}\3@g" \
            -e "s@(href=\"\./styles\.css)(\?v=[^\"]*)?(\")@\1?v=${css_hash}\3@g" \
            index.html

          grep -Fq "./app.js?v=${js_hash}" index.html
          grep -Fq "./styles.css?v=${css_hash}" index.html

          echo "JavaScript fingerprint: ${js_hash}"
          echo "Stylesheet fingerprint: ${css_hash}"

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Build test container
        run: docker build --tag wrapped365:ci .

      - name: Verify runtime identity and HTTP response
        shell: bash
        run: |
          set -euo pipefail

          # Keep failed containers available long enough to inspect their logs.
          # --rm would erase the evidence as soon as the process exits.
          cleanup() {
            exit_code=$?
            if (( exit_code != 0 )); then
              echo '::group::Wrapped 365 container diagnostics'
              docker ps --all --filter name=wrapped365-smoke || true
              docker inspect --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' wrapped365-smoke || true
              docker logs wrapped365-smoke || true
              echo '::endgroup::'
            fi
            docker rm --force wrapped365-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name wrapped365-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,noexec,size=16m,mode=1777 \
            --publish 127.0.0.1:6967:6967 wrapped365:ci

          # Wait for HTTP readiness before running docker exec, and detect a
          # process that exits while starting rather than reporting a race.
          ready=false
          for attempt in {1..30}; do
            state="$(docker inspect --format '{{.State.Status}}' wrapped365-smoke)"
            if [[ "$state" != 'running' ]]; then
              echo "Wrapped 365 exited during startup (state: $state)" >&2
              exit 1
            fi
            if curl --fail --silent --insecure https://localhost:6967/ -o /tmp/wrapped365-index.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo 'Wrapped 365 did not become healthy on port 6967' >&2
            exit 1
          fi

          grep -q 'Wrapped 365' /tmp/wrapped365-index.html
          # Verify the container serves correctly fingerprinted assets
          js_hash="$(sha256sum app.js | cut -c1-12)"
          css_hash="$(sha256sum styles.css | cut -c1-12)"
          grep -Fq "./app.js?v=${js_hash}" /tmp/wrapped365-index.html
          grep -Fq "./styles.css?v=${css_hash}" /tmp/wrapped365-index.html
          echo 'Asset fingerprint verification passed.'
          test "$(curl --fail --silent --insecure https://localhost:6967/VERSION)" = "$(cat VERSION)"
          test "$(docker exec wrapped365-smoke id -u)" = '10001'
          test "$(docker exec wrapped365-smoke id -g)" = '10001'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' wrapped365-smoke)" = 'true'
          echo 'Smoke test passed: HTTP 6967, UID/GID 10001, read-only root filesystem.'

  publish:
    name: Publish multi-architecture image to GHCR
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Fingerprint static assets
        shell: bash
        run: |
          set -euo pipefail

          js_hash="$(sha256sum app.js | cut -c1-12)"
          css_hash="$(sha256sum styles.css | cut -c1-12)"

          sed -i -E \
            -e "s@(src=\"\./app\.js)(\?v=[^\"]*)?(\")@\1?v=${js_hash}\3@g" \
            -e "s@(href=\"\./styles\.css)(\?v=[^\"]*)?(\")@\1?v=${css_hash}\3@g" \
            index.html

          grep -Fq "./app.js?v=${js_hash}" index.html
          grep -Fq "./styles.css?v=${css_hash}" index.html

          echo "JavaScript fingerprint: ${js_hash}"
          echo "Stylesheet fingerprint: ${css_hash}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=beta2,enable=${{ github.ref == 'refs/heads/test2' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
