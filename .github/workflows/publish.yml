name: Build and Publish Wrapped 365 + MDB58

on:
  push:
    branches: [main, test, test2]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Identify affected images
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.event.repository.default_branch }}
          filters: |
            frontend:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Caddyfile'
              - 'index.html'
              - 'app.js'
              - 'MDB58.js'
              - 'styles.css'
              - 'demo-tracks.yaml'
              - 'demo-playlists.yaml'
              - 'jszip.min.js'
              - 'favicon.svg'
              - 'LICENSE-JSZIP.txt'
              - 'VERSION'
              - 'tests/test_hook.cjs'
              - '.github/workflows/publish.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/publish.yml'

  frontend-test:
    name: Wrapped 365 — static checks and non-root smoke test
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Fingerprint static assets
        shell: bash
        run: |
          set -euo pipefail
          js_hash="$(sha256sum app.js | cut -c1-12)"
          mdb_hash="$(sha256sum MDB58.js | cut -c1-12)"
          css_hash="$(sha256sum styles.css | cut -c1-12)"
          sed -i -E \
            -e "s@(src=\"\./app\.js)(\?v=[^\"]*)?(\")@\1?v=${js_hash}\3@g" \
            -e "s@(src=\"\./MDB58\.js)(\?v=[^\"]*)?(\")@\1?v=${mdb_hash}\3@g" \
            -e "s@(href=\"\./styles\.css)(\?v=[^\"]*)?(\")@\1?v=${css_hash}\3@g" \
            index.html
          grep -Fq "./app.js?v=${js_hash}" index.html
          grep -Fq "./MDB58.js?v=${mdb_hash}" index.html
          grep -Fq "./styles.css?v=${css_hash}" index.html
          echo "Fingerprint verification: app=${js_hash}, MDB58=${mdb_hash}, CSS=${css_hash}"

      - name: JavaScript syntax and integration checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check MDB58.js
          node tests/test_hook.cjs

      - name: Build test container
        run: docker build --tag wrapped365:ci .

      - name: Verify runtime identity, TLS and asset fingerprint
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            exit_code=$?
            if (( exit_code != 0 )); then
              docker ps --all --filter name=wrapped365-smoke || true
              docker logs wrapped365-smoke || true
            fi
            docker rm --force wrapped365-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name wrapped365-smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,noexec,size=16m,mode=1777 \
            --publish 127.0.0.1:6967:6967 wrapped365:ci

          ready=false
          for attempt in {1..30}; do
            state="$(docker inspect --format '{{.State.Status}}' wrapped365-smoke)"
            if [[ "$state" != 'running' ]]; then
              echo "Container exited during startup: $state" >&2
              exit 1
            fi
            if curl --fail --silent --insecure https://localhost:6967/ -o /tmp/wrapped365-index.html; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo 'Wrapped 365 did not become healthy on port 6967' >&2
            exit 1
          fi
          grep -q 'Wrapped 365' /tmp/wrapped365-index.html
          js_hash="$(sha256sum app.js | cut -c1-12)"
          mdb_hash="$(sha256sum MDB58.js | cut -c1-12)"
          css_hash="$(sha256sum styles.css | cut -c1-12)"
          grep -Fq "./app.js?v=${js_hash}" /tmp/wrapped365-index.html
          grep -Fq "./MDB58.js?v=${mdb_hash}" /tmp/wrapped365-index.html
          grep -Fq "./styles.css?v=${css_hash}" /tmp/wrapped365-index.html
          test "$(curl --fail --silent --insecure https://localhost:6967/VERSION)" = "$(cat VERSION)"
          test "$(docker exec wrapped365-smoke id -u)" = '10001'
          test "$(docker exec wrapped365-smoke id -g)" = '10001'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' wrapped365-smoke)" = 'true'
          echo 'TLS, fingerprints, non-root and read-only smoke test passed.'

  backend-test:
    name: MDB58 — Python contract and Docker build
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install and test API contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt pytest
          PYTHONPATH=backend python -m pytest -q backend/tests/test_contract.py
          python -m compileall -q backend/app backend/alembic
      - name: Build API image
        run: docker build --tag wrapped365-mdb58:ci ./backend
      - name: Check API runs unprivileged
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' wrapped365-mdb58:ci)" = '10001:10001'
          docker run --rm --entrypoint python wrapped365-mdb58:ci -c 'import fastapi, psycopg, app.main; print("MDB58 imports OK")'

  publish-frontend:
    name: Publish Wrapped 365 (amd64/arm64)
    if: github.event_name != 'pull_request'
    needs: frontend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Fingerprint static assets
        shell: bash
        run: |
          set -euo pipefail
          js_hash="$(sha256sum app.js | cut -c1-12)"
          mdb_hash="$(sha256sum MDB58.js | cut -c1-12)"
          css_hash="$(sha256sum styles.css | cut -c1-12)"
          sed -i -E \
            -e "s@(src=\"\./app\.js)(\?v=[^\"]*)?(\")@\1?v=${js_hash}\3@g" \
            -e "s@(src=\"\./MDB58\.js)(\?v=[^\"]*)?(\")@\1?v=${mdb_hash}\3@g" \
            -e "s@(href=\"\./styles\.css)(\?v=[^\"]*)?(\")@\1?v=${css_hash}\3@g" \
            index.html
          grep -Fq "./app.js?v=${js_hash}" index.html
          grep -Fq "./MDB58.js?v=${mdb_hash}" index.html
          grep -Fq "./styles.css?v=${css_hash}" index.html
          echo "Fingerprint verification: app=${js_hash}, MDB58=${mdb_hash}, CSS=${css_hash}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=beta2,enable=${{ github.ref == 'refs/heads/test2' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
      - name: Build and push Wrapped 365
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wrapped365-frontend
          cache-to: type=gha,scope=wrapped365-frontend,mode=max

  publish-backend:
    name: Publish MDB58 API (amd64/arm64)
    if: github.event_name != 'pull_request'
    needs: backend-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-mdb58
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/test' }}
            type=raw,value=beta2,enable=${{ github.ref == 'refs/heads/test2' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
      - name: Build and push MDB58 API
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mdb58-backend
          cache-to: type=gha,scope=mdb58-backend,mode=max
